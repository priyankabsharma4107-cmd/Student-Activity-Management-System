<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #252052, #4d4695);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 55px 60px;
            border-radius: 25px;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }

        h1 span {
            color: #a98aff;
        }

        .subtitle {
            text-align: center;
            font-size: 22px;
            margin-bottom: 45px;
            color: #ddd;
        }

        label {
            display: block;
            margin: 18px 0 10px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            outline: none;
            background: #f4f4f7;
        }

        button {
            width: 100%;
            margin-top: 32px;
            padding: 17px;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(90deg, #8557ed, #397fea);
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-size: 17px;
            min-height: 22px;
            color: #ffb3b3;
        }

        .register-link {
            text-align: center;
            margin-top: 28px;
            color: #ddd;
            font-size: 18px;
        }

        .register-link a {
            color: #c5aaff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Campus<span>Hub</span></h1>

    <div class="subtitle">Student Portal</div>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

        <div id="message"></div>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script>

const API_URL = "";

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = document.getElementById("message");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.style.color = "#ddd";
    message.textContent = "Logging in...";

    try {

        const response = await fetch(`${API_URL}/api/login`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const text = await response.text();

        let result;

        try {
            result = JSON.parse(text);
        } catch {
            throw new Error(
                `Server returned an invalid response (HTTP ${response.status})`
            );
        }

        if (result.success) {

            localStorage.setItem(
                "currentStudent",
                JSON.stringify(result.student)
            );

            message.style.color = "#b8ffca";
            message.textContent = "Login successful!";

            setTimeout(() => {

                window.location.href = "index.html";

            }, 500);

        } else {

            message.style.color = "#ffb3b3";
            message.textContent =
                result.message || "Login failed.";

        }

    } catch (error) {

        console.error("Login error:", error);

        message.style.color = "#ffb3b3";

        message.textContent =
            error.message || "Something went wrong.";

    }

});

</script>

</body>
</html>
